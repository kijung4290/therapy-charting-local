      현재일정.상태 = '완료';
      var 로컬되돌리기 = 차팅로컬반영(현재일정, 데이터);
      var 되돌리기 = function () {
        로컬되돌리기();
        var 되돌릴일정 = 차팅문자일정찾기(데이터.일정ID);
        if (되돌릴일정) 되돌릴일정.상태 = 이전상태;
        render();
      };
      var 취소됨 = false;
      var 보내기 = function () {
        차팅자동저장.최종저장취소 = null;
        if (취소됨) { 차팅자동저장다음(); return; }
        차팅자동저장.진행중 = true;  // 저장이 끝나기 전에 같은 차팅을 다시 열면 끝난 뒤에 열리도록
        서버호출('차팅저장', 데이터, function (값, 결과) {
          차팅자동저장.진행중 = false;
          차팅자동저장.마지막값 = 차팅자동저장키(데이터);
          if (값 && 값.차팅갱신 && 값.일정갱신) {
            if (상태.차팅로딩됨) {
              상태.차팅 = (상태.차팅 || []).filter(function (차) { return 차.차팅ID || String(차.일정ID) !== String(데이터.일정ID); });
              행패치('차팅', '차팅ID', 값.차팅갱신);
            }
            행패치('일정', '일정ID', 값.일정갱신);
            render();
          } else {
            새로고침데이터(function () {
              상태.차팅로딩됨 = false;
              차팅데이터불러오기(function () { render(); });
            });
          }
          showToast((결과 && 결과.message) || '차팅이 저장되었습니다');
          차팅자동저장다음();
        }, function () {
          차팅자동저장.진행중 = false;
          되돌리기();
          상태.차팅복구 = 데이터;
          // 그사이 다른 창(새 일정 등)을 열어 입력 중이면 덮지 않고, 다음에 이 차팅을 열 때 내용을 채웁니다.
          if ($('modal-overlay').classList.contains('hidden')) {
            차팅자동저장.완료후목록 = [];
            차팅모달(데이터.일정ID);
            showToast('차팅 저장에 실패했습니다. 입력한 내용을 다시 띄웠으니 [차팅 저장]을 한 번 더 눌러 주세요', 'error');
          } else {
            showToast('차팅 저장에 실패했습니다. 해당 차팅을 다시 열면 입력한 내용이 채워져 있으니 [차팅 저장]을 다시 눌러 주세요', 'error');
            차팅자동저장다음();
          }
        }, { 조용히: true });
      };
      닫기모달();
      render();
      showToast('차팅을 저장하는 중입니다', 'info');
      // 자동 저장이 서버로 가는 중이거나 최신본을 확인하는 중이면 그게 끝난 뒤 보냅니다.
      if (차팅자동저장.진행중 || 차팅자동저장.확인중) {
        차팅자동저장.최종저장취소 = function () { 취소됨 = true; 되돌리기(); };  // 충돌 확인에서 '최신 내용 불러오기'를 고르면 취소
        차팅자동저장.완료후목록.push(보내기);
        return;
      }
      보내기();
    }


    // 저장 결과가 오기 전에도 화면(받아 둔 차팅 기록)이 최신 내용을 갖도록 미리 반영합니다.
    // 저장이 실패하면 쓰도록 원래대로 되돌리는 함수를 돌려줍니다.
    function 차팅로컬반영(일정, 데이터) {
      if (!상태.차팅로딩됨) return function () {};
      var 기존 = (상태.차팅 || []).filter(function (차) { return String(차.일정ID) === String(데이터.일정ID); })[0];
      var 필드 = { '관리(시술)내용': 데이터['관리(시술)내용'], '결과평가': 데이터['결과평가'], '데스크기재': 데이터['데스크기재'], '대표님기재': 데이터['대표님기재'] };
      if (기존) {
        var 이전값 = {};
        Object.keys(필드).forEach(function (키) { 이전값[키] = 기존[키]; });
        Object.assign(기존, 필드);
        return function () { Object.assign(기존, 이전값); };
      }
      var 임시 = Object.assign({ 차팅ID: '', 일정ID: 데이터.일정ID, 날짜: 일정.날짜, 치료사: 일정.치료사, 고객: 일정.고객, 서비스: 일정.서비스 }, 필드);
      상태.차팅.push(임시);
      return function () { 상태.차팅 = 상태.차팅.filter(function (차) { return 차 !== 임시; }); };
    }

    function 일정상태바꾸기(상태값) {
      if (!confirm('일정 상태를 \'' + 상태값 + '\'(으)로 변경할까요?')) return;
      서버호출('일정상태변경', { id: 상태.편집일정ID, 상태: 상태값 }, function (값) {
        닫기모달();
        일정반영후렌더(값);
      });
    }

    function 일정수정열기() {
      일정모달(상태.편집일정ID, null);
    }

    function 다음일정예약열기(일정ID) {
      var 일정 = (상태.일정 || []).filter(function (항목) {
        return String(항목.일정ID) === String(일정ID);
      })[0];
      if (!일정) { showToast('일정을 찾을 수 없습니다', 'error'); return; }

      일정모달(
        null,
        다음일정날짜계산(일정.날짜),
        일정.시작시간 || '',
        일정.치료사 || '',
        일정.고객 || '',
        일정.서비스
      );
    }

    function 일정삭제() {
      if (!confirm('이 일정을 삭제할까요?')) return;
      일정삭제요청(상태.편집일정ID, function () { 닫기모달(); });
    }

    // 예약 상태 일정에 차팅이 있으면 서버가 확인을 요청합니다(작성 중 자동 저장본이거나 '예약 복원'한 완료 차팅).
    // 직원이 '함께 삭제'에 동의했을 때만 다시 보냅니다.
    function 일정삭제요청(id, 성공후, 차팅함께삭제) {
      var 인자 = 차팅함께삭제 ? { id: id, 차팅함께삭제: true } : id;
      서버호출('일정삭제', 인자, function (값) {
        if (값 && 값.차팅삭제 && 상태.차팅로딩됨) {
          상태.차팅 = (상태.차팅 || []).filter(function (차) { return String(차.일정ID) !== String(id); });
        }
        if (성공후) 성공후();
        일정반영후렌더(값);
      }, function (결과) {
        if (결과 && 결과.확인필요 && confirm(결과.message)) 일정삭제요청(id, 성공후, true);
      });
    }

    // === 일정 목록 ===
    // 일정 목록은 쌓일수록 한 번에 그리는 데 오래 걸려(5,000건 ≈ 0.5초) 최근 200건씩 나눠 보여 줍니다.
    var 일정목록한번에 = 200;
    function 일정목록더보기() {
      상태.일정목록표시수 = (상태.일정목록표시수 || 일정목록한번에) + 일정목록한번에;
      render();
    }

    function 일정목록HTML() {
      var 목록 = 일정필터링().slice();
      var 고객검색어 = String(상태.일정검색어 || '').trim();
      if (고객검색어) {
        var 일정검색용연락처맵 = {};
        상태.고객.forEach(function (고객) {
          var 이름 = String(고객.이름 || '');
          if (일정검색용연락처맵[이름] == null) 일정검색용연락처맵[이름] = 고객.연락처 || '';
        });
        목록 = 목록.filter(function (일) {
          return 고객검색매치(고객검색어, 일.고객, 일정검색용연락처맵[String(일.고객 || '')]);
        });
      }
      목록.sort(function (a, b) {
        var 날짜비교 = String(b.날짜).localeCompare(String(a.날짜));
        if (날짜비교 !== 0) return 날짜비교;
        return (a.시작시간 || '').localeCompare(b.시작시간 || '');
      });

      var 방문유형맵 = 방문유형맵빌드();
      var 표시수 = 상태.일정목록표시수 || 일정목록한번에;
      var 남은수 = Math.max(0, 목록.length - 표시수);
      var rows = 목록.slice(0, 표시수).map(function (일) {
        var 방문유형 = 방문유형맵[String(일.일정ID)] || 일정방문유형(일);
        return '<tr class="border-b hover:bg-gray-50">' +
          '<td class="px-4 py-3 font-medium text-gray-800 whitespace-nowrap">' + esc(일.날짜) +
          ' <span class="text-xs text-gray-400">(' + 요일문자(일.날짜) + ')</span></td>' +
          '<td class="px-4 py-3 text-sm text-gray-600 whitespace-nowrap">' + esc(일.시작시간 || '--:--') + ' ~ ' + esc(일.종료시간 || '--:--') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-800 whitespace-nowrap"><span class="inline-block w-2 h-2 rounded-full ' + 치료사색상(일.치료사).바 + ' mr-1"></span>' + esc(일.치료사) + '</td>' +
          '<td class="px-4 py-3 text-sm whitespace-nowrap"><div class="flex items-center gap-1.5"><button type="button" onclick="차팅모달(\'' + 일.일정ID + '\')" class="font-semibold text-gray-800 hover:text-blue-600 hover:underline" title="현재 차팅과 이전 누적 기록 보기">' + esc(일.고객) + '</button>' + 방문구분배지HTML(방문유형) + '</div></td>' +
          '<td class="px-4 py-3 text-sm text-gray-600 hidden md:table-cell">' + esc(일정서비스표시(일.서비스)) + '</td>' +
          '<td class="px-3 py-3 text-center whitespace-nowrap">' + 일정확인체크박스HTML(일, '방문확인', '') + '</td>' +
          '<td class="px-3 py-3 text-center whitespace-nowrap">' + 일정확인체크박스HTML(일, '관리확인', '') + '</td>' +
          '<td class="px-3 py-3 text-center whitespace-nowrap">' + 일정확인체크박스HTML(일, '수납확인', '') + '</td>' +
          '<td class="px-4 py-3"><span class="' + 상태배지(일.상태) + '">' + esc(일.상태) + '</span></td>' +
          '<td class="px-4 py-3 text-right whitespace-nowrap">' +
          '<button onclick="차팅모달(\'' + 일.일정ID + '\')" class="text-blue-600 text-sm hover:underline"><i class="fa-solid fa-file-medical mr-1"></i>차팅</button>' +
          '<button onclick="일정모달(\'' + 일.일정ID + '\', null)" class="text-gray-500 text-sm hover:underline ml-3"><i class="fa-solid fa-pen mr-1"></i>수정</button>' +
          '<button onclick="일정리스트삭제(\'' + 일.일정ID + '\')" class="text-red-500 text-sm hover:underline ml-3"><i class="fa-solid fa-trash mr-1"></i>삭제</button>' +
          '</td></tr>';
      }).join('');

      return `
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <h2 class="text-lg font-bold text-gray-800">일정 목록 <span class="text-sm font-normal text-gray-400">${목록.length}건</span></h2>
          <div class="flex items-center gap-2 flex-wrap">
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400"></i>
              <input id="일정고객검색어" type="search" value="${esc(상태.일정검색어)}" oninput="일정고객검색변경(this.value)" placeholder="고객명 또는 연락처 검색" class="border rounded-lg pl-8 pr-3 py-2 text-sm bg-white w-40">
            </div>
            ${상태.일정검색어 ? '<button type="button" onclick="일정고객검색초기화()" class="text-xs text-gray-500 hover:text-blue-600">검색 초기화</button>' : ''}
            ${치료사셀렉트('치료사필터', 상태.치료사필터, 'onchange="치료사필터변경(this.value)"')}
            <button onclick="일정모달(null, null)" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>새 일정</button>
          </div>
        </div>
        <div class="bg-white rounded-2xl shadow overflow-x-auto">
          <table class="w-full text-left">
            <thead><tr class="bg-gray-50 text-xs text-gray-500">
              <th class="px-4 py-3">날짜</th><th class="px-4 py-3">시간</th><th class="px-4 py-3">담당자</th>
              <th class="px-4 py-3">고객</th><th class="px-4 py-3 hidden md:table-cell">서비스</th>
              <th class="px-3 py-3 text-center">방문</th><th class="px-3 py-3 text-center">관리</th><th class="px-3 py-3 text-center">수납</th>
              <th class="px-4 py-3">상태</th><th class="px-4 py-3 text-right">관리</th>
            </tr></thead>
            <tbody>${rows || '<tr><td colspan="10" class="text-center text-gray-400 py-10">등록된 일정이 없습니다</td></tr>'}</tbody>
          </table>
        </div>
        ${남은수 ? `<button type="button" onclick="일정목록더보기()" class="mt-3 w-full bg-white border border-gray-200 hover:bg-gray-50 text-sm font-semibold text-gray-600 py-3 rounded-xl shadow-sm">더 보기 (남은 ${남은수}건)</button>` : ''}`;
    }

    function 일정리스트삭제(id) {
      if (!confirm('이 일정을 삭제할까요?')) return;
      일정삭제요청(id);
    }

    // === 차팅 기록 ===
    function 차팅검색목록() {
      var 검색어 = String(상태.차팅검색어 || '').trim();
      var 일정상태맵 = 일정상태맵빌드();
      var 목록 = 상태.차팅.filter(function (차) { return 유효차팅확인(차, 일정상태맵); });
      if (검색어) {
        var 검색키 = 검색어.toLowerCase();
        var 차팅검색용연락처맵 = {};
        상태.고객.forEach(function (고객) {
          var 이름 = String(고객.이름 || '');
          if (차팅검색용연락처맵[이름] == null) 차팅검색용연락처맵[이름] = 고객.연락처 || '';
        });
        목록 = 목록.filter(function (r) {
          return 고객검색매치(검색어, r.고객, 차팅검색용연락처맵[String(r.고객 || '')]) ||
            String(r.치료사 || '').toLowerCase().indexOf(검색키) >= 0 ||
            String(r.서비스 || '').toLowerCase().indexOf(검색키) >= 0 ||
            String(r['관리(시술)내용'] || '').toLowerCase().indexOf(검색키) >= 0 ||
            String(r['결과평가'] || '').toLowerCase().indexOf(검색키) >= 0 ||
            String(r['데스크기재'] || r['데스크 기재'] || '').toLowerCase().indexOf(검색키) >= 0 ||
            String(r['대표님기재'] || r['대표님 기재'] || '').toLowerCase().indexOf(검색키) >= 0;
        });
      }
      var 시작 = 상태.차팅시작일;
      var 종료 = 상태.차팅종료일;
      if (시작) 목록 = 목록.filter(function (r) { return String(r.날짜) >= 시작; });
      if (종료) 목록 = 목록.filter(function (r) { return String(r.날짜) <= 종료; });
      return 목록.sort(function (a, b) {
        return String(b.날짜 || '').localeCompare(String(a.날짜 || ''));
      });
    }

    // 차팅 기록은 계속 쌓이므로 한 번에 다 그리면 갈수록 화면이 느려집니다. 일정 목록처럼 나눠서 그립니다.
    var 차팅기록한번에 = 200;
    function 차팅기록더보기() {
      상태.차팅기록표시수 = (상태.차팅기록표시수 || 차팅기록한번에) + 차팅기록한번에;
      render();
    }

    function 차팅기록HTML() {
      var 목록 = 차팅검색목록();
      var 표시수 = 상태.차팅기록표시수 || 차팅기록한번에;
      var 남은수 = Math.max(0, 목록.length - 표시수);
      var rows = 목록.slice(0, 표시수).map(function (r) {
        var 금액 = 추출서비스금액(r.서비스);
        var 서비스표시 = 금액 ? Number(금액).toLocaleString('ko-KR') + '원' : esc(r.서비스 || '-');
        return '<tr class="border-b hover:bg-gray-50">' +
          '<td class="px-4 py-3 text-sm text-gray-600 whitespace-nowrap">' + esc(r.날짜 || '-') + '</td>' +
          '<td class="px-4 py-3 font-semibold text-gray-800 whitespace-nowrap">' + esc(r.고객 || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-700 whitespace-nowrap">' + esc(r.치료사 || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm font-semibold text-blue-600 whitespace-nowrap">' + 서비스표시 + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-800">' + esc(r['관리(시술)내용'] || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600 hidden lg:table-cell">' + esc(r['결과평가'] || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600 hidden xl:table-cell">' + esc(r['데스크기재'] || r['데스크 기재'] || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600 hidden 2xl:table-cell">' + esc(r['대표님기재'] || r['대표님 기재'] || '-') + '</td>' +
          '<td class="px-4 py-3 text-right whitespace-nowrap">' +
          '<button onclick="차팅모달(\'' + esc(r.일정ID) + '\')" class="text-blue-600 text-sm hover:underline">상세/수정</button>' +
          '</td></tr>';
      }).join('');

      return `
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div><h2 class="text-lg font-bold text-gray-800">차팅 기록 <span class="text-sm font-normal text-gray-400">${목록.length}건</span></h2><p class="mt-0.5 text-xs text-gray-400">완료 일정의 차팅만 표시하며 취소·노쇼·미완료 기록은 원본만 보존합니다.</p></div>
          <div class="flex flex-wrap items-center gap-2">
            <input id="차팅검색어입력" type="text" value="${esc(상태.차팅검색어)}" oninput="차팅검색어변경(this.value)" placeholder="고객, 치료사, 내용 검색..." class="border rounded-lg px-3 py-1.5 text-xs bg-white w-44">
            <input type="date" value="${esc(상태.차팅시작일)}" onchange="상태.차팅시작일=this.value; 상태.차팅기록표시수=차팅기록한번에; render();" class="border rounded-lg px-3 py-1.5 text-xs bg-white">
            <span class="text-gray-400 text-xs">~</span>
            <input type="date" value="${esc(상태.차팅종료일)}" onchange="상태.차팅종료일=this.value; 상태.차팅기록표시수=차팅기록한번에; render();" class="border rounded-lg px-3 py-1.5 text-xs bg-white">
          </div>
        </div>
        <div class="bg-white rounded-2xl shadow overflow-x-auto">
          <table class="w-full text-left">
            <thead><tr class="bg-gray-50 text-xs text-gray-500">
              <th class="px-4 py-3">날짜</th><th class="px-4 py-3">고객</th><th class="px-4 py-3">담당자</th>
              <th class="px-4 py-3">서비스</th><th class="px-4 py-3">시술/관리내용</th><th class="px-4 py-3 hidden lg:table-cell">결과/평가</th><th class="px-4 py-3 hidden xl:table-cell">데스크 기재</th><th class="px-4 py-3 hidden 2xl:table-cell">대표님 기재</th><th class="px-4 py-3 text-right">관리</th>
            </tr></thead>
            <tbody>${rows || '<tr><td colspan="9" class="text-center text-gray-400 py-10">검색 조건에 맞는 차팅 기록이 없습니다</td></tr>'}</tbody>
          </table>
        </div>
        ${남은수 ? `<button type="button" onclick="차팅기록더보기()" class="mt-3 w-full bg-white border border-gray-200 hover:bg-gray-50 text-sm font-semibold text-gray-600 py-3 rounded-xl shadow-sm">더 보기 (남은 ${남은수}건)</button>` : ''}`;
    }

    // === 날짜 / 기간 판별 유틸리티 ===
    function C열서비스명추출(서) {
      if (!서) return '';
      if (typeof 서 === 'string') return 서;
      var 후보키 = ['서비스명', '서비스 금액', '서비스', '항목명'];
      for (var i = 0; i < 후보키.length; i++) {
        if (서[후보키[i]] != null && String(서[후보키[i]]).trim() !== '') {
          return String(서[후보키[i]]);
        }
      }
      var keys = Object.keys(서);
      if (keys.length >= 3 && keys[2] !== 'ID' && keys[2] !== '등록일시') {
        if (서[keys[2]] != null && String(서[keys[2]]).trim() !== '') return String(서[keys[2]]);
      }
      return 서.ID ? String(서.ID) : '';
    }

    function D열금액추출(서) {
      if (!서) return '';
      var 후보키 = ['금액(원)', '금액(원)', '금액', '금액 (원)', '단가', '가격', '금액_원'];
      for (var i = 0; i < 후보키.length; i++) {
        if (서[후보키[i]] != null && String(서[후보키[i]]).trim() !== '') {
          return 서[후보키[i]];
        }
      }
      var keys = Object.keys(서);
      for (var j = 0; j < keys.length; j++) {
        var k = keys[j];
        if (k !== '서비스명' && k !== 'ID' && k !== '등록일시' && (k.indexOf('금액') >= 0 || k.indexOf('원') >= 0 || k.indexOf('가격') >= 0)) {
          if (서[k] != null && String(서[k]).trim() !== '') return 서[k];
        }
      }
      if (keys.length >= 4 && keys[3] !== 'ID' && keys[3] !== '등록일시' && keys[3] !== '서비스명') {
        if (서[keys[3]] != null && String(서[keys[3]]).trim() !== '') return 서[keys[3]];
      }
      return '';
    }

    function 추출서비스금액(서) {
      if (서 == null) return 0;
      if (typeof 서 === 'number') return isFinite(서) && 서 > 0 ? 서 : 0;
      var str = String(서).trim();
      if (!str) return 0;

      // 1. 서비스 색인에서 서비스명(C열)/서비스명 컬럼으로 조회 (예전에는 매번 전체 배열을 훑었습니다)
      var 색인 = 색인갱신();
      var 금액 = 색인.서비스금액[str];
      if (금액 > 0) return 금액;
      if (색인.서비스존재[str]) return 0;

      // 2. 값 전체가 금액 표기인 경우만 숫자로 변환합니다.
      // '하루 30명 무료체험', '전류관리 10분', '1회 서비스' 내부 숫자는 금액이 아닙니다.
      if (!/^[0-9][0-9,]*(?:\.0+)?\s*(?:원)?$/.test(str)) return 0;
      var num = Number(str.replace(/원/g, '').replace(/,/g, '').trim());
      if (!isNaN(num) && num > 0) return num;

      return 0;
    }

    // 집계에서 일정의 서비스값을 서비스목록의 C열 이름으로 정규화할 때 씁니다.
    // 원래 로직(서비스를 앞에서부터 훑어 5가지 조건 중 하나라도 맞는 첫 항목)과 결과가 같도록
    // 직접 일치 색인과 숫자 일치 색인에서 각각 찾은 뒤 더 앞선 인덱스를 선택합니다.
    function 서비스표준명(원본서비스) {
      var 색인 = 색인갱신();
      var 직접 = 색인.서비스직접[원본서비스];
      var 원본문자 = String(원본서비스 == null ? '' : 원본서비스).trim();
      var 순수금액 = /^[0-9][0-9,]*(?:\.0+)?\s*(?:원)?$/.test(원본문자);
      var rawNum = 순수금액 ? String(Number(원본문자.replace(/원/g, '').replace(/,/g, '').trim())) : '';
      var 숫자 = (rawNum && rawNum !== '0' && rawNum !== 'NaN') ? 색인.서비스숫자[rawNum] : undefined;
      var idx = 직접 == null ? 숫자 : (숫자 == null ? 직접 : Math.min(직접, 숫자));
      if (idx == null) return 원본서비스;
      return 색인.서비스이름[idx] || 원본서비스;
    }

    // 달력과 일정 목록에는 서비스목록 D열의 금액을 원화 형식으로 표시합니다.
    // 기존 일정에 C열 서비스명이 저장돼 있어도 서비스목록과 대조해 D열 금액으로 바꿉니다.
    function 일정서비스표시(서비스값) {
      var 금액 = 추출서비스금액(서비스값);
      return 금액 ? Number(금액).toLocaleString('ko-KR') + '원' : String(서비스값 || '');
    }

    // 달력 카드는 폭이 좁으므로 긴 무료체험 서비스명만 짧게 표시합니다.
    // 저장값과 일정 목록 등 다른 화면의 서비스명은 변경하지 않습니다.
    function 달력서비스표시(서비스값) {
      var 표시값 = 일정서비스표시(서비스값);
      return 표시값.replace(/\s/g, '') === '하루30명무료체험' ? '무료체험' : 표시값;
    }

    function 날짜파싱(날짜문자) {
      if (!날짜문자) return null;
      var str = String(날짜문자).substring(0, 10);
      var d = new Date(str + 'T00:00:00');
      return isNaN(d.getTime()) ? null : d;
    }

    // 기준일에서 파생되는 값(주 시작/끝, 분기 범위 등)은 일정마다 똑같으므로 한 번만 계산해 둡니다.
    // 이후 판정은 Date 객체 생성 없이 'yyyy-MM-dd' 문자열 비교만으로 처리합니다.
    function 기간기준(기준일) {
      기준일 = 기준일 || new Date();
      var ry = 기준일.getFullYear(), rm = 기준일.getMonth() + 1, rdate = 기준일.getDate();
      var dayOfWeek = (기준일.getDay() + 6) % 7;
      var weekStart = new Date(ry, 기준일.getMonth(), rdate - dayOfWeek);
      var weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 6);
      var rq = Math.floor((rm - 1) / 3);
      var 반기시작월 = rm <= 6 ? 1 : 7;
      var 연문자 = String(ry);
      function 월문자(월) { return 연문자 + '-' + ('0' + 월).slice(-2); }
      return {
        오늘: fmtDate(기준일),
        주시작: fmtDate(weekStart),
        주끝: fmtDate(weekEnd),
        월접두: 월문자(rm),
        분기시작: 월문자(rq * 3 + 1),
        분기끝: 월문자(rq * 3 + 3) + '-32',
        반기시작: 월문자(반기시작월),
        반기끝: 월문자(반기시작월 + 5) + '-32',
        연접두: 연문자 + '-'
      };
    }

    function 기간판별(날짜문자, 기준일, 기준) {
      기준 = 기준 || 기간기준(기준일);
      var s = String(날짜문자 == null ? '' : 날짜문자).substring(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        return { 당일: false, 주: false, 월: false, 분기: false, 반기: false, 연: false };
      }
      var 연 = s.indexOf(기준.연접두) === 0;
      return {
        당일: s === 기준.오늘,
        주: s >= 기준.주시작 && s <= 기준.주끝,
        월: s.indexOf(기준.월접두) === 0,
        분기: 연 && s >= 기준.분기시작 && s <= 기준.분기끝,
        반기: 연 && s >= 기준.반기시작 && s <= 기준.반기끝,
        연: 연
      };
    }

    // === 고객 관리 ===
    function 고객누적이용횟수(고객명) {
      if (!고객명) return 0;
      var 이름 = String(고객명).trim();
      var 완료일정IDSet = {};
      var 추가건수 = 0;

      (상태.일정 || []).forEach(function (일) {
        if (String(일.고객 || '').trim() === 이름 && 완료상태확인(일.상태)) {
          if (일.일정ID) 완료일정IDSet[String(일.일정ID)] = true;
          else 추가건수++;
        }
      });

      return Object.keys(완료일정IDSet).length + 추가건수;
    }

    function 고객누적결제금액(고객명) {
      if (!고객명) return 0;
      var 이름 = String(고객명).trim();
      var 완료일정Map = {};
      var 추가금액 = 0;

      (상태.일정 || []).forEach(function (일) {
        if (String(일.고객 || '').trim() === 이름 && 완료상태확인(일.상태)) {
          if (일.일정ID) 완료일정Map[String(일.일정ID)] = 일.서비스;
          else 추가금액 += 추출서비스금액(일.서비스);
        }
      });

      return Object.keys(완료일정Map).reduce(function (합계, id) {
        return 합계 + 추출서비스금액(완료일정Map[id]);
      }, 추가금액);
    }

    // 고객 목록처럼 모든 고객에 대해 반복 호출하면 고객수 × 전체 일정/차팅건수로 느려지므로,
    // 렌더링 1회당 전체 고객의 이용횟수·결제금액을 한 번의 순회로 계산해 맵으로 재사용합니다.
    function 고객집계맵빌드() {
      var 맵 = {};
      function 항목가져오기(이름) {
        if (!맵[이름]) 맵[이름] = { 완료ID맵: {}, 추가건수: 0, 추가금액: 0 };
        return 맵[이름];
      }
      (상태.일정 || []).forEach(function (일) {
        if (!완료상태확인(일.상태)) return;
        var 이름 = String(일.고객 || '').trim();
        if (!이름) return;
        var 항목 = 항목가져오기(이름);
        if (일.일정ID) {
          항목.완료ID맵[String(일.일정ID)] = 일.서비스;
        } else {
          항목.추가건수++;
          항목.추가금액 += 추출서비스금액(일.서비스);
        }
      });
      var 결과 = {};
      Object.keys(맵).forEach(function (이름) {
        var 항목 = 맵[이름];
        var idKeys = Object.keys(항목.완료ID맵);
        var 결제금액 = idKeys.reduce(function (합, id) {
          return 합 + 추출서비스금액(항목.완료ID맵[id]);
        }, 항목.추가금액);
        결과[이름] = { 이용횟수: idKeys.length + 항목.추가건수, 결제금액: 결제금액 };
      });
      return 결과;
    }

    function 고객검색변경(값) {
      상태.고객검색어 = 값;
      검색갱신예약('고객명단', function () {
        render('고객이름검색어');
      });
    }

    function 고객검색초기화() {
      상태.고객검색어 = '';
      render();
      var 검색창 = $('고객이름검색어');
      if (검색창) 검색창.focus();
    }

    function 검색고객등록() {
      고객모달(null, String(상태.고객검색어 || '').trim());
    }

    function 고객HTML() {
      var 검색어 = String(상태.고객검색어 || '').trim();
      var 검색키 = 검색어.toLowerCase();
      var 전화검색 = 숫자전용검색어인가(검색어);
      var 고객목록 = 상태.고객.filter(function (대) {
        return 고객검색매치(검색어, 대.이름, 대.연락처);
      });
      var 정확히일치 = 검색키 && (전화검색 || 상태.고객.some(function (대) {
        return String(대.이름 || '').trim().toLowerCase() === 검색키;
      }));
      var 고객집계맵 = 고객집계맵빌드();
      var rows = 고객목록.map(function (대) {
        var 집계 = 고객집계맵[String(대.이름 || '').trim()] || { 이용횟수: 0, 결제금액: 0 };
        var 횟수 = 집계.이용횟수;
        var 결제금액 = 집계.결제금액;
        return '<tr class="border-b hover:bg-gray-50">' +
          '<td class="px-4 py-3 font-semibold text-gray-800 whitespace-nowrap"><button type="button" onclick="고객차팅이력모달(\'' + esc(대.ID) + '\')" class="inline-flex items-center gap-1.5 text-left hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300 rounded-lg" title="고객 상세 정보 및 예약·차팅 이력 보기">' + esc(대.이름) +
          ' <span class="bg-blue-50 text-blue-600 border border-blue-200/80 px-2 py-0.5 rounded-full text-xs font-semibold">(' + 횟수 + '회)</span>' +
          ' <span class="bg-emerald-50 text-emerald-600 border border-emerald-200/80 px-2 py-0.5 rounded-full text-xs font-semibold">(' + 결제금액.toLocaleString('ko-KR') + '원)</span>' +
          '<i class="fa-solid fa-clock-rotate-left text-xs text-blue-400 ml-0.5"></i></button></td>' +
          '<td class="px-4 py-3 text-sm text-gray-600">' + esc(대.생년월일 || '-') + ' (' + esc(대.성별 || '-') + ')</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600">' + esc(대.연락처 || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600 hidden md:table-cell">' + esc(대.주소 || '-') + '</td>' +
          '<td class="px-4 py-3 text-sm text-gray-600 hidden lg:table-cell">' + esc(대.특이사항 || '-') + '</td>' +
          '<td class="px-4 py-3 text-right whitespace-nowrap">' +
          '<button onclick="고객예약모달(\'' + js문자(대.이름) + '\')" class="text-emerald-600 text-sm font-semibold hover:underline mr-3"><i class="fa-solid fa-calendar-plus mr-1"></i>예약</button>' +
          '<button onclick="고객모달(\'' + 대.ID + '\')" class="text-blue-600 text-sm hover:underline">수정</button>' +
          '<button onclick="고객삭제(\'' + 대.ID + '\')" class="text-red-500 text-sm hover:underline ml-3">삭제</button>' +
          '</td></tr>';
      }).join('');

      return `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
          <h2 class="text-lg font-bold text-gray-800">고객 명단 <span class="text-sm font-normal text-gray-400">${검색어 ? 고객목록.length + '/' : ''}${상태.고객.length}명</span></h2>
          <button onclick="고객모달(null)" class="self-start sm:self-auto bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>고객 등록</button>
        </div>
        <div class="bg-white rounded-2xl shadow p-4 mb-4">
          <label for="고객이름검색어" class="block text-sm font-semibold text-gray-700 mb-2">고객 이름 · 연락처 검색</label>
          <div class="flex items-center gap-2">
            <div class="relative flex-1">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400"></i>
              <input id="고객이름검색어" type="search" value="${esc(상태.고객검색어)}" oninput="고객검색변경(this.value)" placeholder="이름 또는 연락처 중간·뒷자리 4자리 입력" autocomplete="off" class="w-full border rounded-lg pl-9 pr-3 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-200 focus:border-blue-500">
            </div>
            ${검색어 ? '<button type="button" onclick="고객검색초기화()" class="shrink-0 text-sm text-gray-500 hover:text-blue-600 px-2 py-2">초기화</button>' : ''}
          </div>
        </div>
        ${검색어 && !정확히일치 ? `
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mb-4">
            <div class="text-sm text-amber-900"><i class="fa-solid fa-circle-info mr-1.5"></i><strong>“${esc(검색어)}”</strong> 이름으로 등록된 고객이 없습니다.</div>
            <button type="button" onclick="검색고객등록()" class="shrink-0 bg-amber-600 hover:bg-amber-700 text-white text-sm font-semibold px-4 py-2 rounded-lg"><i class="fa-solid fa-user-plus mr-1"></i>이 이름으로 바로 등록</button>
          </div>` : ''}
        <div class="bg-white rounded-2xl shadow overflow-x-auto">
          <table class="w-full text-left">
            <thead><tr class="bg-gray-50 text-xs text-gray-500">
              <th class="px-4 py-3">이름 <span class="font-normal text-blue-500">(클릭 시 상세/예약/차팅)</span></th><th class="px-4 py-3">생년월일(성별)</th><th class="px-4 py-3">연락처</th>
              <th class="px-4 py-3 hidden md:table-cell">주소</th><th class="px-4 py-3 hidden lg:table-cell">특이사항</th><th class="px-4 py-3 text-right">관리</th>
            </tr></thead>
            <tbody>${rows || '<tr><td colspan="6" class="text-center text-gray-400 py-10">' + (검색어 ? '검색 결과가 없습니다' : '등록된 고객이 없습니다') + '</td></tr>'}</tbody>
          </table>
        </div>`;
    }

    function 고객모달(id, 기본이름) {
      상태.편집고객ID = id || null;
      var 편집 = id ? 상태.고객.filter(function (대) { return String(대.ID) === String(id); })[0] : null;
      var 신규이름 = 편집 ? 편집.이름 : String(기본이름 || '').trim();

      오픈모달(`
        <div class="p-6">
          <div class="flex items-center justify-between mb-5">
            <h3 class="text-lg font-bold text-gray-800">${편집 ? '고객 정보 수정' : '신규 고객 등록'}</h3>
            <button onclick="닫기모달()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-gray-600 mb-1">이름 *</label>
              <input id="고객이름" value="${esc(신규이름)}" class="w-full border rounded-lg px-3 py-2.5">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-600 mb-1">생년월일</label>
              <input id="고객생년월일" type="date" value="${esc(편집 ? 편집.생년월일 : '')}" class="w-full border rounded-lg px-3 py-2.5">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-600 mb-1">성별</label>
              <select id="고객성별" class="w-full border rounded-lg px-3 py-2.5 bg-white">
                <option value="남"${편집 && 편집.성별 === '남' ? ' selected' : ''}>남</option>
                <option value="여"${편집 && 편집.성별 === '여' ? ' selected' : ''}>여</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-600 mb-1">연락처</label>
              <input id="고객연락처" value="${esc(편집 ? 편집.연락처 : '')}" placeholder="예: 010-1234-5678" class="w-full border rounded-lg px-3 py-2.5">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-semibold text-gray-600 mb-1">주소</label>
              <input id="고객주소" value="${esc(편집 ? 편집.주소 : '')}" class="w-full border rounded-lg px-3 py-2.5">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-semibold text-gray-600 mb-1">특이사항</label>
              <input id="고객특이사항" value="${esc(편집 ? 편집.특이사항 : '')}" class="w-full border rounded-lg px-3 py-2.5">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-semibold text-gray-600 mb-1">비고</label>
              <input id="고객비고" value="${esc(편집 ? 편집.비고 : '')}" class="w-full border rounded-lg px-3 py-2.5">
            </div>
            ${편집 ? '' : `<label class="md:col-span-2 flex items-center gap-2 cursor-pointer mt-1">
              <input type="checkbox" id="고객문자발송" class="w-4 h-4 text-blue-600 rounded">
              <span class="text-sm font-medium text-gray-700">고객 등록 완료 문자 전송 <span class="text-xs text-gray-400 font-normal">(등록 안내문자를 전송합니다)</span></span>
            </label>`}
          </div>
          <button onclick="고객저장()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg"><i class="fa-solid fa-floppy-disk mr-1"></i>저장</button>
        </div>`);
    }

    function 고객저장() {
      var 데이터 = {
        이름: $('고객이름').value,
        생년월일: $('고객생년월일').value,
        성별: $('고객성별').value,
        연락처: $('고객연락처').value,
        주소: $('고객주소').value,
        특이사항: $('고객특이사항').value,
        비고: $('고객비고').value,
        문자발송: $('고객문자발송') ? $('고객문자발송').checked : false
      };
      if (상태.편집고객ID) 데이터.id = 상태.편집고객ID;
      서버호출('고객저장', 데이터, function (값, 결과) {
        var 이름변경 = 결과 && 결과.data && 결과.data.이름변경;
        if (이름변경) {
          // 서버에서 과거 일정·차팅까지 갱신했으므로, 현재 화면 캐시도 같이 바꿨니다.
          [상태.일정 || [], 상태.차팅 || []].forEach(function (목록) {
            목록.forEach(function (행) {
              if (String(행.고객 || '').trim() === String(이름변경.기존이름 || '').trim()) 행.고객 = 이름변경.새이름;
            });
          });
        }
        닫기모달();
        showToast(결과.message, 결과.data && 결과.data.문자 && !결과.data.문자.success ? 'warning' : 'success');
        목록반영후렌더('고객', 값);
      });
    }

    function 고객삭제(id) {
      var 이름 = (상태.고객.filter(function (대) { return String(대.ID) === String(id); })[0] || {}).이름;
      if (!confirm('고객 "' + 이름 + '"을(를) 삭제할까요?')) return;
      서버호출('고객삭제', id, function (값) {
        목록반영후렌더('고객', 값);
      });
    }

    // === 치료사 관리 ===
    function 치료사고객목록검색(검색값) {
      var 검색어 = String(검색값 || '').trim().toLowerCase();
      var 검색숫자 = 연락처숫자만(검색어);
      var 목록영역 = $('치료사고객목록');
      if (!목록영역) return;

      var 항목들 = 목록영역.querySelectorAll('[data-search-text]');
      var 표시건수 = 0;
      Array.prototype.forEach.call(항목들, function (항목) {
        var 검색대상 = String(항목.getAttribute('data-search-text') || '').toLowerCase();
        var 검색대상숫자 = String(항목.getAttribute('data-search-digits') || '');
        var 표시 = !검색어 || 검색대상.indexOf(검색어) >= 0 || (검색숫자 && 검색대상숫자.indexOf(검색숫자) >= 0);
        항목.classList.toggle('hidden', !표시);
        if (표시) 표시건수++;
      });

      var 결과수 = $('치료사고객검색결과수');
      if (결과수) 결과수.textContent = 표시건수 + '명';
      var 결과없음 = $('치료사고객검색결과없음');
      if (결과없음) 결과없음.classList.toggle('hidden', 표시건수 > 0 || !검색어);
    }

    function 치료사고객목록모달(id) {
      var 치료사 = (상태.치료사 || []).filter(function (항목) {
        return String(항목.ID) === String(id);
      })[0];
      if (!치료사) { showToast('담당자를 찾을 수 없습니다', 'error'); return; }

      var 담당자명 = String(치료사.이름 || '').trim();
      var 매칭일정 = (상태.일정 || []).filter(function (일) {
        return 담당자명 && String(일.치료사 || '').trim() === 담당자명 && String(일.고객 || '').trim();
      }).sort(function (a, b) {
        var 날짜비교 = String(b.날짜 || '').localeCompare(String(a.날짜 || ''));
        if (날짜비교 !== 0) return 날짜비교;
        return String(b.시작시간 || '').localeCompare(String(a.시작시간 || ''));
      });

      var 고객맵 = {};
      var 고객순서 = [];
      매칭일정.forEach(function (일) {
        var 고객명 = String(일.고객 || '').trim();
        if (!고객맵[고객명]) {
          고객맵[고객명] = { 이름: 고객명, 일정: [], 완료횟수: 0 };
          고객순서.push(고객명);
        }
        고객맵[고객명].일정.push(일);
        if (완료상태확인(일.상태)) 고객맵[고객명].완료횟수++;
      });

      var 고객목록HTML = 고객순서.map(function (고객명) {
        var 묶음 = 고객맵[고객명];
        var 차팅대상 = 묶음.일정.filter(function (일) { return 완료상태확인(일.상태); })[0] ||
          묶음.일정.filter(function (일) { return !취소상태확인(일.상태); })[0] || 묶음.일정[0];
        var 고객정보 = (상태.고객 || []).filter(function (고객) {
          return String(고객.이름 || '').trim() === 고객명;
        })[0] || {};
        var 보조정보 = [고객정보.연락처, 고객정보.생년월일].filter(function (값) {
          return String(값 || '').trim();
        }).join(' · ') || '고객 추가 정보 없음';

        return '<button type="button" data-search-text="' + esc([고객명, 고객정보.생년월일].join(' ')) + '" data-search-digits="' + esc(연락처숫자만(고객정보.연락처)) + '" onclick="차팅모달(\'' + esc(차팅대상.일정ID) + '\')" class="group w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-left hover:border-blue-300 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-300 transition">' +
          '<div class="flex flex-wrap items-center justify-between gap-3">' +
          '<div class="min-w-0"><div class="inline-flex items-center gap-2 font-bold text-gray-800 group-hover:text-blue-700 group-hover:underline"><i class="fa-solid fa-user text-blue-500"></i>' + esc(고객명) + '</div>' +
          '<div class="mt-1 text-xs text-gray-500 truncate">' + esc(보조정보) + '</div></div>' +
          '<div class="shrink-0 text-right"><div class="text-xs font-semibold text-blue-600"><i class="fa-solid fa-file-medical mr-1"></i>관리차팅 열기</div>' +
          '<div class="mt-1 text-[11px] text-gray-500">기준 ' + esc(차팅대상.날짜 || '-') + ' · ' + esc(차팅대상.상태 || '-') + '</div></div>' +
          '</div>' +
          '<div class="mt-2 flex flex-wrap gap-2 text-[11px]">' +
          '<span class="rounded-full bg-blue-100 px-2 py-0.5 font-semibold text-blue-700">전체 일정 ' + 묶음.일정.length + '건</span>' +
          '<span class="rounded-full bg-emerald-100 px-2 py-0.5 font-semibold text-emerald-700">완료 ' + 묶음.완료횟수 + '건</span>' +
          '</div></button>';
      }).join('');

      오픈모달(`
        <div class="p-6">
          <div class="flex items-start justify-between gap-3 mb-5">
            <div>
              <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-user-doctor text-blue-600 mr-1.5"></i>${esc(담당자명)} 담당 고객</h3>
              <p class="mt-1 text-xs text-gray-500">일정에서 이 담당자와 매칭된 고객 ${고객순서.length}명 · 고객 이름을 누르면 관리차팅이 열립니다.</p>
            </div>
            <button type="button" onclick="닫기모달()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
          </div>
          <div class="mb-4 rounded-xl border border-blue-100 bg-blue-50/60 p-3">
            <div class="flex items-center gap-2">
              <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-sm text-gray-400"></i>
                <input id="치료사고객검색" type="search" oninput="치료사고객목록검색(this.value)" autocomplete="off" placeholder="고객명, 연락처 또는 생년월일로 조회" class="w-full rounded-lg border border-blue-200 bg-white py-2.5 pl-9 pr-3 text-sm focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-200">
              </div>
              <span id="치료사고객검색결과수" class="shrink-0 rounded-full border border-blue-200 bg-white px-2.5 py-1 text-xs font-bold text-blue-700">${고객순서.length}명</span>
            </div>
          </div>
          <div id="치료사고객목록" class="max-h-[58vh] overflow-y-auto pr-1 space-y-2">
            ${고객목록HTML || '<div class="rounded-xl border border-dashed border-gray-300 bg-gray-50 px-4 py-10 text-center text-sm text-gray-400">이 담당자와 매칭된 고객이 없습니다.</div>'}
            <div id="치료사고객검색결과없음" class="hidden rounded-xl border border-dashed border-gray-300 bg-gray-50 px-4 py-10 text-center text-sm text-gray-400">조회 조건에 맞는 고객이 없습니다.</div>
          </div>
        </div>`, 'max-w-3xl');
    }

    function 치료사HTML() {
      // 담당자마다 전체 일정을 다시 훑으면 O(담당자수 × 일정수)입니다. 한 번의 순회로 담당자별 고객 수를 셉니다.
      var 담당자별고객 = {};
      (상태.일정 || []).forEach(function (일) {
        var 담당 = String(일.치료사 || '').trim();
        var 고객 = String(일.고객 || '').trim();
        if (!담당 || !고객) return;
        var 묶음 = 담당자별고객[담당] || (담당자별고객[담당] = {});
        묶음[고객] = true;
      });

      var rows = 상태.치료사.map(function (치) {
        var 매칭고객수 = Object.keys(담당자별고객[String(치.이름 || '').trim()] || {}).length;
        return '<tr class="border-b hover:bg-gray-50">' +
          '<td class="px-4 py-3 font-medium text-gray-800"><button type="button" onclick="치료사고객목록모달(\'' + esc(치.ID) + '\')" title="담당 고객 조회" class="inline-flex items-center gap-2 text-left font-bold text-blue-700 hover:text-blue-900 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-300 rounded-lg"><i class="fa-solid fa-user-doctor text-blue-500"></i>' + esc(치.이름) + '<span class="rounded-full border border-blue-200 bg-blue-50 px-2 py-0.5 text-xs font-semibold text-blue-600"><i class="fa-solid fa-magnifying-glass mr-1"></i>고객 조회 ' + 매칭고객수 + '명</span></button></td>' +

    // === 집계 ===
    function 집계대상() {
      var 목록 = 상태.일정.slice();
      if (상태.집계치료사) 목록 = 목록.filter(function (일) { return String(일.치료사) === String(상태.집계치료사); });
      var 시작 = 상태.집계시작일;
      var 종료 = 상태.집계종료일;
      if (시작) 목록 = 목록.filter(function (일) { return String(일.날짜) >= 시작; });
      if (종료) 목록 = 목록.filter(function (일) { return String(일.날짜) <= 종료; });
      return 목록;
    }

    function 집계분(일) {
      var s = String(일.시작시간 || '').split(':');
      var e = String(일.종료시간 || '').split(':');
      var sm = parseInt(s[0], 10) * 60 + parseInt(s[1], 10);
      var em = parseInt(e[0], 10) * 60 + parseInt(e[1], 10);
      if (isNaN(sm) || isNaN(em)) return 0;
      var 차 = em - sm;
      return 차 > 0 ? 차 : 0;
    }

    function 분포맞춤(분) {
      var h = Math.floor(분 / 60), m = 분 % 60;
      if (h > 0) return h + '시간' + (m ? ' ' + m + '분' : '');
      return m + '분';
    }

    function 집계기간퀵설정(옵션) {
      var d = new Date();
      var y = d.getFullYear();
      var m = d.getMonth();
      var date = d.getDate();

      var 시작일 = '';
      var 종료일 = '';

      if (옵션 === '당일') {
        시작일 = fmtDate(d);
        종료일 = fmtDate(d);
      } else if (옵션 === '이번 주' || 옵션 === '이번주' || 옵션 === '주') {
        var dayOfWeek = (d.getDay() + 6) % 7;
        var mon = new Date(y, m, date - dayOfWeek);
        var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
        시작일 = fmtDate(mon);
        종료일 = fmtDate(sun);
      } else if (옵션 === '이번 달' || 옵션 === '이번달' || 옵션 === '월') {
        var first = new Date(y, m, 1);
        var last = new Date(y, m + 1, 0);
        시작일 = fmtDate(first);
        종료일 = fmtDate(last);
      } else if (옵션 === '이번 분기' || 옵션 === '이번분기' || 옵션 === '분기') {
        var q = Math.floor(m / 3);
        var first = new Date(y, q * 3, 1);
        var last = new Date(y, (q + 1) * 3, 0);
        시작일 = fmtDate(first);
        종료일 = fmtDate(last);
      } else if (옵션 === '이번 반기' || 옵션 === '이번반기' || 옵션 === '반기') {
        var h = m < 6 ? 0 : 6;
        var first = new Date(y, h, 1);
        var last = new Date(y, h + 6, 0);
        시작일 = fmtDate(first);
        종료일 = fmtDate(last);
      } else if (옵션 === '올해 (연간)' || 옵션 === '올해' || 옵션 === '연간') {

        var last = new Date(y, 11, 31);

        종료일 = fmtDate(last);
      }

      상태.집계종료일 = 종료일;
      상태.집계퀵옵션 = 옵션;

    }

    function 집계기간변경(종류, 값) {
      if (종류 === '시작') 상태.집계시작일 = 값;
      else 상태.집계종료일 = 값;
      상태.집계퀵옵션 = '';

    function 집계치료사변경(값) {

    }

    function 집계HTML() {
      var 오늘 = new Date();

      // 상단 매출 카드: 담당자 필터 반영
      var 매출대상일정 = 상태.일정.filter(function (일) {
        if (!완료상태확인(일.상태)) return false;
        if (상태.집계치료사 && String(일.치료사 || '').trim() !== String(상태.집계치료사).trim()) return false;
        return true;
      });

      var 센터합산액 = { 당일: 0, 주: 0, 월: 0, 분기: 0, 반기: 0, 연: 0 };
      var 기준 = 기간기준(오늘);
      매출대상일정.forEach(function (일) {
        var 금액 = 추출서비스금액(일.서비스);

        if (f.연) 센터합산액.연 += 금액;

      // 선택 기간 및 필터 적용 집계
      var 목록 = 집계대상();
      var 총건수 = 목록.length;
      var 상태수 = { '예약': 0, '완료': 0, '노쇼': 0, '취소': 0 };

        if (상태수[s] != null) 상태수[s]++;

      목록.forEach(function (일) {
        var 치명 = String(일.치료사 || '').trim();
        if (치명) {

          if (완료상태확인(일.상태)) {
            치료사그룹Map[치명].완료건수++;
            치료사그룹Map[치명].매출액 += 추출서비스금액(일.서비스);
            치료사그룹Map[치명].총분 += 집계분(일);

      });

      var 치료사분석목록 = Object.keys(치료사그룹Map).map(function (k) { return 치료사그룹Map[k]; });
      치료사분석목록.sort(function (a, b) {
        return b.매출액 - a.매출액 || b.완료건수 - a.완료건수 || b.총분 - a.총분;
      });

      var 치료사분석행목록 = 치료사분석목록.map(function (item, i) {

      }).join('') || '<tr><td colspan="5" class="text-center text-gray-400 py-8">해당 조건의 데이터가 없습니다</td></tr>';

        // 서비스 색인으로 C열 표준 서비스명을 찾습니다.

      var 고객그룹Map = {};
      완료일정목록.forEach(function (일) {
        var 고객명 = String(일.고객 || '').trim();
        if (고객명) {
          if (!고객그룹Map[고객명]) 고객그룹Map[고객명] = { 이름: 고객명, 건수: 0, 총분: 0, 매출액: 0 };
          고객그룹Map[고객명].건수++;
          고객그룹Map[고객명].총분 += 집계분(일);
          고객그룹Map[고객명].매출액 += 추출서비스금액(일.서비스);
        }
      });

      var 고객횟수목록 = Object.keys(고객그룹Map).map(function (k) { return 고객그룹Map[k]; });
      고객횟수목록.sort(function (a, b) {
        return b.건수 - a.건수 || b.매출액 - a.매출액 || b.총분 - a.총분;
      });

      var 고객방문횟수행목록 = 고객횟수목록.map(function (c, i) {
        return '<tr class="border-b hover:bg-emerald-50/30 transition-colors">' +
          '<td class="px-3 py-2.5 text-center text-xs font-bold text-gray-400">' + (i + 1) + '</td>' +

      // 상세 일정 리스트
      var 기간일정 = 목록.slice().sort(function (a, b) {
        var 날짜비교 = String(a.날짜).localeCompare(String(b.날짜));
        if (날짜비교 !== 0) return 날짜비교;
        return (a.시작시간 || '').localeCompare(b.시작시간 || '');
      });
      var 통합행 = 기간일정.map(function (일) {
        var 금액 = 추출서비스금액(일.서비스);
        return '<tr class="border-b hover:bg-gray-50">' +
          '<td class="px-4 py-2.5 text-sm text-gray-600 whitespace-nowrap">' + esc(일.날짜) + ' <span class="text-gray-400">(' + 요일문자(일.날짜) + ')</span></td>' +
          '<td class="px-4 py-2.5 text-sm text-gray-600 whitespace-nowrap">' + esc(일.시작시간 || '--:--') + ' ~ ' + esc(일.종료시간 || '--:--') + '</td>' +
          '<td class="px-4 py-2.5 text-sm text-gray-800 whitespace-nowrap"><span class="inline-block w-2 h-2 rounded-full ' + 치료사색상(일.치료사).바 + ' mr-1"></span>' + esc(일.치료사) + '</td>' +
          '<td class="px-4 py-2.5 text-sm text-gray-800">' + esc(일.고객) + '</td>' +
          '<td class="px-4 py-2.5 text-sm font-semibold text-blue-600">' + (금액 ? 금액.toLocaleString('ko-KR') + '원' : esc(일.서비스)) + '</td>' +
          '<td class="px-4 py-2.5"><span class="' + 상태배지(일.상태) + '">' + esc(일.상태) + '</span></td>' +
          '<td class="px-4 py-2.5 text-sm text-gray-500">' + esc(일.비고 || '') + '</td>' +
          '</tr>';
      }).join('') || '<tr><td colspan="7" class="text-center text-gray-400 py-8">등록된 일정이 없습니다</td></tr>';

      var 통합표 = `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mt-6">

            <span class="font-bold text-gray-800 text-sm"><i class="fa-solid fa-list-check text-blue-600 mr-2"></i>기간 상세 일정 목록 (${esc(상태.집계시작일)} ~ ${esc(상태.집계종료일)})</span>
            <span class="text-xs text-blue-600 font-bold bg-blue-50 px-3 py-1 rounded-full border border-blue-100">선택 조건 완료 매출: ${선택기간매출.toLocaleString('ko-KR')}원</span>

                <th class="px-4 py-2.5">서비스(금액)</th><th class="px-4 py-2.5">상태</th><th class="px-4 py-2.5">비고</th>
              </tr></thead>
              <tbody>${통합행}</tbody>
            </table>
          </div>
        </div>`;

      var 퀵버튼목록 = ['당일', '이번 주', '이번 달', '이번 분기', '이번 반기', '올해 (연간)'].map(function (opt) {
        var active = 상태.집계퀵옵션 === opt || (opt === '이번 달' && !상태.집계퀵옵션 && 상태.집계시작일 === 이번달시작문자());
        return '<button type="button" onclick="집계기간퀵설정(\'' + opt + '\')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ' +
          (active ? 'bg-blue-600 text-white shadow-sm' : 'bg-gray-100 text-gray-700 hover:bg-gray-200') + '">' + opt + '</button>';
      }).join('');

      var 카드제목 = '선택 기간 완료 매출 합산액';

      else if (상태.집계퀵옵션 === '이번 주') 카드제목 = '이번 주 완료 매출 합산액';
      else if (상태.집계퀵옵션 === '이번 달') 카드제목 = '이번 달 완료 매출 합산액';
      else if (상태.집계퀵옵션 === '이번 분기') 카드제목 = '이번 분기 완료 매출 합산액';
      else if (상태.집계퀵옵션 === '이번 반기') 카드제목 = '이번 반기 완료 매출 합산액';

      return `

            <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">

            <p class="text-xs text-gray-500 mt-0.5">선택한 기간/담당자 조건으로 상단 매출 카드, 요약 지표, 분석 표, 일정 목록이 즉시 변경됩니다.</p>
          </div>

        <!-- ⚡ 집계 탭 기간 & 담당자 통합 필터바 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6">

            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-xs font-bold text-gray-500 mr-1.5 flex items-center gap-1"><i class="fa-solid fa-bolt text-amber-500"></i>기간 퀵옵션</span>
              ${퀵버튼목록}
            </div>

            <!-- 담당자 및 날짜 수동 지정 -->
            <div class="flex flex-wrap items-center gap-3">

              </div>
              <div class="flex items-center gap-1">
                <span class="text-xs font-semibold text-gray-500">조회 기간</span>
                <input type="date" value="${esc(상태.집계시작일)}" onchange="집계기간변경('시작', this.value)" class="border rounded-lg px-2.5 py-1.5 text-xs bg-white">
                <span class="text-gray-400 text-xs">~</span>
                <input type="date" value="${esc(상태.집계종료일)}" onchange="집계기간변경('종료', this.value)" class="border rounded-lg px-2.5 py-1.5 text-xs bg-white">
              </div>
            </div>
          </div>
        </div>

        <!-- 선택 조건 매출 합산액 카운트 카드 -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl shadow-md p-6 text-white mb-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <div class="flex items-center gap-2 text-blue-100 text-xs font-bold uppercase tracking-wider mb-1">
                <i class="fa-solid fa-vault text-blue-200"></i>
                <span>${카드제목}</span>
                ${상태.집계치료사 ? '<span class="bg-white/20 text-white text-[11px] px-2 py-0.5 rounded-full font-semibold">담당자 필터 적용됨</span>' : ''}
              </div>
              <div class="text-3xl md:text-4xl font-extrabold tracking-tight">
                ${선택기간매출.toLocaleString('ko-KR')}<span class="text-lg md:text-xl font-normal text-blue-100 ml-1">원</span>
              </div>
            </div>
            <div class="text-right">
              <span class="inline-block bg-white/10 backdrop-blur-md px-3.5 py-1.5 rounded-xl text-xs font-semibold text-blue-50 border border-white/20">
                <i class="fa-regular fa-calendar-check mr-1.5"></i>${esc(상태.집계시작일)}${상태.집계시작일 !== 상태.집계종료일 ? ' ~ ' + esc(상태.집계종료일) : ''}
              </span>
              <div class="text-xs text-blue-200 mt-1.5">완료 건수: <strong class="text-white">${상태수['완료']}건</strong> &nbsp;|&nbsp; 치료시간: <strong class="text-white">${분포맞춤(총분)}</strong></div>
            </div>
          </div>
        </div>

        <!-- 기간 요약 지표 카드 -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3"><div class="text-xs font-semibold text-gray-500">조회 일정</div><div class="text-lg font-bold text-blue-600 mt-1">${총건수}건</div></div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3"><div class="text-xs font-semibold text-gray-500">예약 건수</div><div class="text-lg font-bold text-blue-500 mt-1">${상태수['예약']}건</div></div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3"><div class="text-xs font-semibold text-gray-500">완료 건수</div><div class="text-lg font-bold text-green-600 mt-1">${상태수['완료']}건</div></div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3"><div class="text-xs font-semibold text-gray-500">노쇼 건수</div><div class="text-lg font-bold text-red-500 mt-1">${상태수['노쇼']}건</div></div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3"><div class="text-xs font-semibold text-gray-500">취소 건수</div><div class="text-lg font-bold text-gray-500 mt-1">${상태수['취소']}건</div></div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3"><div class="text-xs font-semibold text-gray-500">총 치료시간</div><div class="text-lg font-bold text-gray-800 mt-1">${분포맞춤(총분)}</div></div>
        </div>

        <!-- 📊 담당자별, 서비스별, 고객별 3개 독립 카드 섹션 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-6">
          <!-- 1. 담당자별 경영 분석 카드 섹션 -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
            <div>
              <div class="px-5 py-4 bg-gray-50/80 border-b flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-user-doctor text-blue-600"></i>담당자별 경영 분석
                  </h3>
                  <p class="text-xs text-gray-400 mt-0.5">담당자별 완료 건수 · 치료시간 · 매출액</p>
                </div>
                <span class="text-xs text-blue-600 font-bold bg-blue-50 px-2.5 py-1 rounded-full border border-blue-100">${치료사분석목록.length}명</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <thead><tr class="bg-gray-100/70 text-xs text-gray-600 border-b">
                    <th class="px-3 py-2.5 text-center">순위</th>
                    <th class="px-3 py-2.5">담당자</th>
                    <th class="px-3 py-2.5 text-center">완료 건수</th>
                    <th class="px-3 py-2.5 text-center">치료시간</th>
                    <th class="px-3 py-2.5 text-right">매출액</th>
                  </tr></thead>
                  <tbody>${치료사분석행목록}</tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 2. 서비스별 경영 분석 카드 섹션 -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
            <div>
              <div class="px-5 py-4 bg-gray-50/80 border-b flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i>서비스별 경영 분석
                  </h3>
                  <p class="text-xs text-gray-400 mt-0.5">서비스별 완료 건수 · 치료시간 · 매출액</p>
                </div>
                <span class="text-xs text-indigo-600 font-bold bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100">${서비스분석목록.length}종</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <thead><tr class="bg-gray-100/70 text-xs text-gray-600 border-b">
                    <th class="px-3 py-2.5 text-center">순위</th>
                    <th class="px-3 py-2.5">서비스</th>
                    <th class="px-3 py-2.5 text-center">완료 건수</th>
                    <th class="px-3 py-2.5 text-center">치료시간</th>
                    <th class="px-3 py-2.5 text-right">매출액</th>
                  </tr></thead>
                  <tbody>${서비스분석행목록}</tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 3. 고객별 방문 횟수 카드 섹션 -->
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
            <div>
              <div class="px-5 py-4 bg-gray-50/80 border-b flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-users text-emerald-600"></i>고객별 방문 횟수
                  </h3>
                  <p class="text-xs text-gray-400 mt-0.5">고객별 방문 횟수 · 치료시간 · 이용 금액</p>
                </div>
                <span class="text-xs text-emerald-600 font-bold bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-100">${고객횟수목록.length}명</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <thead><tr class="bg-gray-100/70 text-xs text-gray-600 border-b">
                    <th class="px-3 py-2.5 text-center">순위</th>
                    <th class="px-3 py-2.5">고객명</th>
                    <th class="px-3 py-2.5 text-center">방문 횟수</th>
                    <th class="px-3 py-2.5 text-center">치료시간</th>
                    <th class="px-3 py-2.5 text-right">이용 금액</th>
                  </tr></thead>
                  <tbody>${고객방문횟수행목록}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        ${통합표}
      `;
    }

    // === 초기화 ===
    function 초기데이터불러오기() {
      if (상태.로그인토큰) {
        서버호출('관리자확인', { 토큰: 상태.로그인토큰 }, function (data) {
          if (data && !data.유효) {
            상태.로그인토큰 = '';
            sessionStorage.removeItem('치료차팅토큰');
          }
        });
      }
      render();
      google.script.run
        .withSuccessHandler(function (결과) {
          if (결과 && 결과.success && 결과.data) {
            상태.고객 = 결과.data.고객 || [];
            상태.치료사 = 결과.data.치료사 || [];
            상태.서비스 = 결과.data.서비스 || [];
            상태.일정 = 결과.data.일정 || [];
            상태.오프 = 결과.data.오프 || [];
            상태.담당자순서 = Array.isArray(결과.data.담당자순서) ? 결과.data.담당자순서 : [];
            if (Array.isArray(결과.data.차팅)) {
              상태.차팅 = 결과.data.차팅;
              상태.차팅로딩됨 = true;
            }
            render();
            // 차팅 기록은 첫 화면이 뜬 뒤 화면을 잠그지 않고 미리 받아 둡니다. (차팅 창을 기다림 없이 바로 열기 위함)
            setTimeout(function () {
              차팅데이터불러오기(function () { if (상태.탭 === '고객' || 상태.탭 === '차팅기록') render(); }, true);
            }, 1500);
          } else {
            console.error('[초기 로딩 실패]', 결과);
            var 메시지 = (결과 && 결과.message) || '데이터를 불러오지 못했습니다';
            $('main-content').innerHTML = '<div class="text-center py-20 text-red-500">' +
              '<i class="fa-solid fa-triangle-exclamation text-4xl mb-4"></i>' +
              '<p class="mb-4">' + esc(메시지) + '</p>' +
              '<button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg">다시 시도</button></div>';
          }
        })
        .withFailureHandler(function (에러) {
          $('main-content').innerHTML = '<div class="text-center py-20 text-red-500">' +
            '<i class="fa-solid fa-triangle-exclamation text-4xl mb-4"></i>' +
            '<p class="mb-4">서버 오류: ' + esc(에러.message) + '</p>' +
            '<button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg">다시 시도</button></div>';
        })
        .getBootstrapData();
    }

    (function () {
      if (상태.앱접속토큰) {
        초기데이터불러오기();
      } else {
        render();
        setTimeout(function () { $('앱접속비번입력') && $('앱접속비번입력').focus(); }, 100);
      }
    })();
  </script>
</body>

</html>
